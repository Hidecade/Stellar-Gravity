<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Stellar Gravity</title>
    <meta name="apple-mobile-web-app-title" content="Stellar Gravity">

    <link rel="icon" href="img/StellarGravity.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/StellarGravity.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-panel-left">
            <div class="hud-item">
                <span class="hud-label">HIGH SCORE</span>
                <span id="hi-score-val" class="hi-score-num">0</span>
                <span class="hi-stage-text">Stage <span id="hi-stage-val">1</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span id="score-val" class="score-num">0</span>
            </div>
        </div>

        <div class="hud-panel-right">
            <span class="next-label">NEXT</span>

            <div id="next-ui"></div>

            <div id="next-name"></div>

            <div id="timer-bar-container">
                <div id="timer-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title-text">
            STELLAR<br class="title-br" /><span class="title-space">&nbsp;</span>GRAVITY
        </h1>

        <div id="controls-hint" style="margin-top: 25px; font-size: 10px; letter-spacing: 2px; color: #aaa; line-height: 1.6;">
            [PC] LEFT / RIGHT : BOOST | SPACE : SHOOT<br>
            [TOUCH] TAP SCREEN : SHOOT
        </div>

        <button id="start-btn" class="btn">START</button>

        <div id="control-mode-selector" aria-label="Control Mode Selector">
            <button id="mode-dual-btn" class="btn mode-btn">L/R Mode</button>
            <button id="mode-right-only-btn" class="btn mode-btn">R Mode</button>
        </div>



        <button id="show-ranking-btn" class="btn sub-btn" style="margin-top: 20px;">WORLD RANKING</button>

        <button id="soundtrack-btn" class="btn sub-btn" style="margin-top: 15px;">SOUNDTRACK</button>


        <div id="name-input-area" style="margin-top: 15px;">
            <div id="my-estimated-rank" style="font-size: 16px; color: #ffd700; margin-bottom: 10px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);">
                CHECKING RANK...
            </div>
            <div style="font-size:10px; color:#aaa; margin-bottom:5px; letter-spacing: 2px;">ENTER YOUR NAME</div>
            <input type="text" id="player-name-input" maxlength="10" placeholder="AAA"
                   style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px; font-family: 'Orbitron', sans-serif; text-align: center; border-radius: 5px; outline: none; margin-bottom: 10px;">
            <br>
            <button id="submit-score-btn" class="btn sub-btn" style="background: #4facfe; color: #000; border-color: #4facfe; opacity: 1; box-shadow: 0 0 10px #4facfe;">SUBMIT SCORE</button>

            <button id="skip-score-btn" class="btn sub-btn" style="margin-top: 5px; border:none; font-size:10px; opacity:1;">NO THANKS / SKIP</button>
        </div>

        <button id="clear-hi-btn" class="btn sub-btn">CLEAR MY HIGH SCORE</button>
        <div id="title-version">ver. --</div>
        <p id="clear-message" style="margin-top:20px; font-size:16px; letter-spacing:1px; opacity:0.9; display:none;"></p>
    </div>

    <div id="ranking-overlay">
        <h2 style="font-size:24px; letter-spacing:2px; color:#fff; margin-bottom:10px; text-shadow: 0 0 15px #4facfe;">WORLD RANKING</h2>
        <div id="loading-ranking" ...>LOADING...</div>

        <div class="ranking-scroll-wrapper">
            <table class="ranking-table" id="ranking-table" style="display:none;">
                <thead>
                    <tr>
                        <th width="15%">RANK</th>
                        <th width="45%">NAME</th>
                        <th width="15%">STAGE</th>
                        <th width="25%">SCORE</th>
                    </tr>
                </thead>
                <tbody id="ranking-list-body">
                </tbody>
            </table>
        </div>
        <button id="close-ranking-btn" class="btn sub-btn">CLOSE</button>
    </div>

    <div id="soundtrack-overlay">
        <h2 style="font-size:24px; letter-spacing:4px; margin-bottom:10px;">SOUNDTRACK</h2>
        <ul class="track-list" id="track-list-container">
        </ul>
        <div id="soundtrack-progress-panel">
            <div id="soundtrack-progress-times">
                <span id="soundtrack-current-time">0:00</span>
                <span id="soundtrack-total-time">0:00</span>
            </div>
            <input type="range" id="soundtrack-seek-bar" min="0" max="1" step="0.01" value="0" aria-label="Soundtrack Seek Bar">
        </div>
        <button id="soundtrack-back-btn" class="btn sub-btn">BACK</button>
    </div>

    <div id="pause-overlay">
        <div class="pause-text">PAUSED</div>
        <button id="pause-resume-btn" class="pause-menu-btn">RESUME</button>
        <button id="pause-quit-btn" class="pause-menu-btn">TITLE</button>
    </div>

    <div id="boost-controls">
        <button id="boost-left-btn" aria-label="Boost Left">
            <svg class="boost-arrow-svg" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M14 19a14 14 0 1 1 5 18" />
                <path d="M13 11v11h11" />
            </svg>
        </button>
        <button id="boost-right-btn" aria-label="Boost Right">
            <svg class="boost-arrow-svg" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M34 19a14 14 0 1 0-5 18" />
                <path d="M35 11v11H24" />
            </svg>
            <span class="boost-text-label" aria-hidden="true">BOOST</span>
        </button>
    </div>

    <div id="bottom-right-ui">
        <div id="management-btn-area">
            <button id="hud-pause-btn">PAUSE</button>

            <div id="bgm-control-pos">
                <button id="bgm-toggle">BGM ON</button>
            </div>
        </div>

        <div id="stage-ui" class="ui-faded">
            <div class="stage-label">Stage</div>
            <div id="stage-val" class="stage-num">1</div>
        </div>
    </div>


    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>

    <script type="module" src="js/firebase.js"></script>
    </script>
</body>
</html>
