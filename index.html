<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Stellar Gravity</title>
    <meta name="apple-mobile-web-app-title" content="Stellar Gravity">

    <link rel="icon" href="img/StellarGravity.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/StellarGravity.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        /* =========================================================
        * Global / Layout
        * ========================================================= */
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            color: white;
            position: fixed;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            font-weight: 200 !important;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            -webkit-touch-callout: none;
        }

        /* =========================================================
             * HUD (Top Score / Next) - Compact & TRON Style
             * ========================================================= */
        /* 共通パネルスタイル */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 5px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            /* ▼▼▼ ここを変更（背景のメッシュを消す） ▼▼▼ */
            background: none;
            /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */
        }

        /* Common Panel Style */

        /* 共通パネルスタイル：内側にグリッドとフェード効果を追加 */
        .hud-panel-left, .hud-panel-right {
            background: rgba(5, 15, 30, 0.3);
            border: none;
            box-shadow: none;
            /* パネル内限定のグリッド */
            background-image: linear-gradient(rgba(0, 247, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 247, 255, 0.1) 1px, transparent 1px);
            background-size: 15px 15px;
            /* ▼▼▼ 追加：端に向かってフェードアウトさせるマスク ▼▼▼ */
            /* 四方の縁をグラデーションで透過させます */
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 95%);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 95%);
            /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

            padding: 8px 12px;
            position: relative;
            overflow: hidden;
            height: 110px;
            min-width: 130px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

            .hud-panel-left > *, .hud-panel-right > * {
                position: relative;
                z-index: 1;
            }

        .hud-panel-left {
            border-left: 5px solid #00f7ff;
            align-items: flex-start;
        }

        .hud-panel-right {
            border-right: 5px solid #00f7ff;
            align-items: center;
        }

        .hud-item {
            width: 100%;
        }

        .hud-label, .next-label {
            font-size: 16px;
            color: #00f7ff;
            letter-spacing: 1px;
            font-weight: bold;
            display: block;
            margin-bottom: 0px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 247, 255, 0.8);
        }

        .score-num {
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 15px #00f7ff;
            font-weight: 400;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .hi-score-num {
            font-size: 24px;
            font-weight: 400;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff6600;
            font-variant-numeric: tabular-nums;
        }

        .hi-stage-text {
            margin-left: 8px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #aaa;
            text-shadow: 0 0 10px #fff;
        }

        #hi-stage-val {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff6600;
        }

        /* NEXT UI */
        #next-ui {
            height: 46px;
            width: 46px;
            margin: 2px auto;
            position: relative;
            background: radial-gradient(circle, rgba(0,247,255,0.1) 0%, transparent 60%);
            border-radius: 50%;
            border: 1px dotted rgba(180, 180, 180, 0.6);
            box-shadow: inset 0 0 10px rgba(150, 150, 150, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

            #next-ui canvas {
                position: static;
                width: 46px;
                height: 46px;
                display: block;
                filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
            }

        #next-name {
            margin-top: 2px;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
            line-height: 1.1;
            text-shadow: 0 0 8px currentColor;
            white-space: nowrap;
        }

        /* Timer Bar */
        #timer-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00f7ff;
            border-radius: 0;
            margin-top: 4px;
            overflow: hidden;
            display: none;
            box-shadow: 0 0 5px #00f7ff;
        }

        #timer-bar-fill {
            height: 100%;
            background: #ff3c3c;
            box-shadow: 0 0 15px #ff0000, inset 0 0 5px #fff;
            transition: width 0.1s linear;
        }

        /* Text Glow Effects */
        h1#title-text {
            text-shadow: 0 0 20px #00f7ff, 0 0 40px #00f7ff, 0 0 80px #fff;
        }

        .btn, .sub-btn, .pause-menu-btn, #hud-pause-btn, #bgm-toggle {
            border-color: #00f7ff !important;
            text-shadow: 0 0 8px rgba(0, 247, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.2), inset 0 0 5px rgba(0, 247, 255, 0.2);
        }

            .btn:hover, .pause-menu-btn:hover {
                background: #00f7ff !important;
                color: #000 !important;
                box-shadow: 0 0 30px #00f7ff !important;
            }

        .stage-num {
            text-shadow: 0 0 15px #00f7ff, 0 0 30px #fff;
        }

        /* =========================================================
             * Overlay (Title / Result)
             * ========================================================= */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            transition: opacity 0.5s;
        }

            #overlay.hide {
                opacity: 0;
                pointer-events: none;
            }

        /* =========================================================
             * Soundtrack Overlay
             * ========================================================= */
        #soundtrack-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 20, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            text-align: center;
        }

        /* --- 修正箇所: リスト部分のスクロール操作を許可する --- */
        .track-list, #ranking-overlay, #soundtrack-overlay {
            touch-action: pan-y !important; /* 上下スクロールを許可 */
        }

        .track-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            width: 80%;
            max-width: 400px;
            /* ▼▼▼ ここを変更（縦に長くする） ▼▼▼ */
            max-height: 60vh; /* 40vh -> 60vh に拡大 */
            /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #00f7ff transparent;
        }
            /* Webkit Scrollbar */
            .track-list::-webkit-scrollbar {
                width: 6px;
            }

            .track-list::-webkit-scrollbar-thumb {
                background-color: rgba(0, 247, 255, 0.5);
                border-radius: 3px;
            }

        .track-item {
            padding: 10px 15px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 12px;
            letter-spacing: 2px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .track-item:hover {
                background: rgba(255,255,255,0.1);
                color: white;
            }

            .track-item.active {
                border-color: #4facfe;
                background: rgba(79,172,254,0.2);
                color: #fff;
                text-shadow: 0 0 8px rgba(79,172,254,0.8);
            }

        .track-icon {
            font-size: 12px;
        }

        /* =========================================================
        * Pause Overlay
        * ========================================================= */
        #pause-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .pause-text {
            font-size: 42px;
            letter-spacing: 8px;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .pause-menu-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 4px;
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.8);
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
            min-width: 200px;
            transition: all 0.2s;
        }

            .pause-menu-btn:hover {
                background: white;
                color: black;
            }

        #pause-quit-btn {
            font-size: 14px;
            padding: 12px 30px;
            opacity: 0.8;
            border-color: rgba(255, 100, 100, 0.6);
            color: #ffcccc;
        }

            #pause-quit-btn:hover {
                background: rgba(255, 50, 50, 0.8);
                color: white;
            }

        h1 {
            margin: 0;
            font-size: 42px;
            line-height: 1.1;
            letter-spacing: 6px;
            font-weight: 200;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 18px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.8);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 4px;
        }

            .btn:hover {
                background: white;
                color: black;
            }

        .sub-btn {
            margin-top: 15px; /* 間隔を少し微調整 */
            padding: 12px 0; /* 上下パディングのみ指定（左右はwidthで決まるため0でOK） */
            /* ▼▼▼ 幅を固定して揃える ▼▼▼ */
            width: 280px;
            /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.8; /* 視認性を上げるため少し不透明度アップ */
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 30px; /* 丸みを少し強く */
            transition: all 0.3s;
            /* テキストを中央揃えに */
            text-align: center;
        }

            /* ホバー時の挙動（既存のTRONスタイルに合わせる） */
            .sub-btn:hover {
                opacity: 1.0;
                background: rgba(0, 247, 255, 0.2);
                border-color: #00f7ff;
                box-shadow: 0 0 15px rgba(0, 247, 255, 0.4);
                color: #fff;
            }

        /* =========================================================
         * Action Buttons (BOOST, PAUSE, BGM) - Gradient & Sharp
         * ========================================================= */
        #boost-btn, #hud-pause-btn, #bgm-toggle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #00f7ff;
            /* ▼▼▼ 背景をグラデーションに変更して質感を出す ▼▼▼ */
            /* 上部：少し明るいシアン（反射光） -> 下部：深い闇 */
            background: linear-gradient( 180deg, rgba(0, 247, 255, 0.15) 0%, rgba(5, 15, 30, 0.9) 60%, rgba(0, 0, 0, 0.95) 100% );
            /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */
            /* 中央だけを表示し、上下両端をフェードアウトさせる */

            mask-image: linear-gradient( to bottom, transparent 0%, black 40%, black 70%, transparent 100% );
            -webkit-mask-image: linear-gradient( to bottom, transparent 0%, black 40%, black 70%, transparent 100% );

            border: 4px solid #00f7ff;
            border-radius: 0px; /* 角張った形状 */

            cursor: pointer;
            outline: none;
            text-shadow: 0 0 8px rgba(0, 247, 255, 0.8);
            /* ガラスのような反射光(inset)を追加 */
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(0, 247, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 247, 255, 0.1) 1px, transparent 1px);
            background-size: 15px 15px;
        }

            /* ホバー時：グラデーションを全体的に明るく */
            #boost-btn:hover, #hud-pause-btn:hover, #bgm-toggle:hover {
                /* 背景のシアン成分を強める */
                background: linear-gradient( 180deg, rgba(0, 247, 255, 0.3) 0%, rgba(5, 25, 40, 0.9) 100% );
                box-shadow: 0 0 25px rgba(0, 247, 255, 0.6);
                color: #fff;
                text-shadow: 0 0 10px #fff, 0 0 20px #00f7ff;
            }

            /* 押した時（変更なし）：内側から発光 */
            #boost-btn:active, #hud-pause-btn:active, #bgm-toggle:active {
                background: radial-gradient(circle, rgba(220, 255, 255, 0.5) 0%, rgba(0, 247, 255, 0.3) 90%);
                color: #fff;
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #00f7ff;
                border-color: rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 40px rgba(0, 247, 255, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.4);
                transform: scale(0.97);
            }

        /* Left Bottom: BOOST Specific Style */
        #boost-btn {
            position: fixed;
            bottom: 60px;
            left: 32px;
            width: 160px; /* 横長で押しやすく */
            height: 70px;
            font-size: 20px;
            z-index: 20;
        }

            /* BOOSTボタン専用の外枠装飾（二重線の演出） */
            #boost-btn::before {
                content: "";
                position: absolute;
                inset: -6px; /* 本体より一回り大きく */
                border: 1px solid rgba(0, 247, 255, 0.3); /* 薄い外枠 */
                box-shadow: 0 0 10px rgba(0, 247, 255, 0.1);
                pointer-events: none;
                z-index: -1;
                transition: all 0.3s;
            }

            /* ホバー時に外枠が広がって反応する */
            #boost-btn:hover::before {
                inset: -10px;
                border-color: rgba(0, 247, 255, 0.6);
                opacity: 0.5;
            }

        /* Right Bottom: PAUSE/BGM & Stage */
        #bottom-right-ui {
            position: fixed;
            right: 24px;
            bottom: 60px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none;
            z-index: 1000;
        }

        #management-btn-area {
            position: relative;
            pointer-events: auto;
            display: flex;
            align-items: center;
            height: 36px;
        }

       

        #hud-pause-btn {
            width: 70px;
            height: 32px;
            font-size: 10px;
            padding: 0;
            display: none;
        }

        #bgm-control-pos {
            display: block;
            width: 100px;
            height: 32px;
        }

        #bgm-toggle {
            width: 100%;
            height: 100%;
            font-size: 10px;
            padding: 0;
        }

        /* Stage Display Area */
        #stage-ui {
            text-align: right;
            pointer-events: none;
        }

        /* ラベル：発光を抑える（text-shadowを最小限に） */
        .stage-label {
            font-size: 12px;
            letter-spacing: 2px;
            color: #aaa;
            text-shadow: 0 0 10px #fff, 0 0 20px #00f7ff;
        }

        /* 数値：強く発光（白とシアンの輝き） */
        .stage-num {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #00f7ff;
        }

        .ui-faded {
            opacity: 0.3;
            transition: opacity 0.5s;
        }

        .score-bounce {
            animation: score-bounce 0.5s ease-out;
        }

        #controls-hint {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
        }

        @keyframes score-bounce {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            30% {
                transform: scale(1.1);
                opacity: 0.8;
                text-shadow: 0 0 10px #fff;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* =========================================================
        * Ranking UI (Neon Style)
        * ========================================================= */
        #ranking-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 20, 0.95);
            backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid #00f7ff;
            box-shadow: inset 0 0 50px rgba(0, 247, 255, 0.2);

            overflow-y: auto; /* コンテンツが溢れたらスクロール */
            justify-content: flex-start; /* 上寄せにしてスクロールしやすくする */
            padding-top: 60px; /* 上部に余白 */
            padding-bottom: 60px; /* 下部に余白 */
        }

            #ranking-overlay h2 {
                font-size: 24px;
                letter-spacing: 4px;
                color: #fff;
                margin-bottom: 20px;
                text-shadow: 0 0 15px #00f7ff, 0 0 30px #00f7ff;
                border-bottom: 2px solid #00f7ff;
                padding-bottom: 10px;
            }

        /* --- ランキング表のコンパクト化 (修正版) --- */
        .ranking-table {
            width: 95%; /* 横幅は少し広げる */
            max-width: 500px;
            border-collapse: collapse;
            color: #fff;
            margin: 10px 0; /* マージン縮小 */
            font-size: 13px; /* フォントサイズ縮小 (16px -> 13px) */
            letter-spacing: 1px;
            background: rgba(0, 247, 255, 0.05);
            border: 1px solid rgba(0, 247, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.1);
        }

            .ranking-table th, .ranking-table td {
                padding: 8px 4px; /* パディングを大幅に縮小 (10px -> 6px) */
                border-bottom: 1px solid rgba(0, 247, 255, 0.2);
                text-align: center;
            }

            .ranking-table th {
                color: #00f7ff;
                font-size: 12px; /* ヘッダー文字も小さく */
                letter-spacing: 2px;
                text-shadow: 0 0 8px rgba(0, 247, 255, 0.6);
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .ranking-table td {
                font-variant-numeric: tabular-nums;
                line-height: 1.1; /* 行の高さを抑える */
            }

        /* Rank Colors */
        .rank-1 {
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-text 3s linear infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            font-size: 22px;
            font-weight: bold;
        }

        @keyframes rainbow-text {
            to {
                background-position: 200% center;
            }
        }

        .rank-2 {
            color: #00f7ff;
            text-shadow: 0 0 12px #00f7ff;
            font-size: 18px;
            font-weight: bold;
        }

        .rank-3 {
            color: #ff00ff;
            text-shadow: 0 0 12px #ff00ff;
            font-size: 18px;
            font-weight: bold;
        }

        /* Name Input Area (Neon Style) */
        #name-input-area {
            margin-top: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(5, 15, 30, 0.9);
            padding: 30px 40px;
            border-radius: 10px;
            border: 2px solid #00f7ff;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.4), inset 0 0 20px rgba(0, 247, 255, 0.1);
        }

            #name-input-area > div:first-child {
                text-shadow: 0 0 10px currentColor;
                letter-spacing: 2px;
            }

    <script>
        /* =========================================================
         * Stellar Gravity
         * ========================================================= */
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const SUPERNOVA_BONUS = 3000;
        const SUPERNOVA_CLEAR_DELAY = 450;
        const SUPERNOVA_END_DELAY = 1100;

        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;



        const gameBgmEl = document.getElementById("game-bgm");
        const clearBgm = document.getElementById("clear-bgm");
        const titleBgm = document.getElementById("title-bgm");

        // Pause Elements
        const hudPauseBtn = document.getElementById("hud-pause-btn");
        const pauseResumeBtn = document.getElementById("pause-resume-btn");
        const pauseQuitBtn = document.getElementById("pause-quit-btn");
        const pauseOverlay = document.getElementById("pause-overlay");

        /* Game State */
        let isClearing = false;
        let isPaused = false;
        const START_STAGE = 1;

        let WIDTH = window.innerWidth;
        let HEIGHT = window.innerHeight;
        let CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

        const DEADLINE_RADIUS = 180;
        const SPAWN_RADIUS = 220;

        const REDZONE_ROT_SPEED = 0.0015;
        const REDZONE_SPARK_RATE = 0.12;

        const CORE_DEFAULT = 50;
        const CORE_MAX = 95;
        const CORE_GROW = 6;
        let CORE_RADIUS = Math.min(CORE_MAX, CORE_DEFAULT + CORE_GROW * (START_STAGE - 1));

        let pendingCoreBoost = false;
        let isContinue = false;

        let isBoosting = false;
        const ROTATE_BASE_SPEED = 0.015;
        const ROTATE_BOOST_MULT = 3.5;
        const STAR_BOOST_MULT = 3.0;
        const STAR_BASE_SPEED = 6.0;

        let clearCount = 0;
        let difficulty = 1.0;
        const DIFF_STEP = 0.12;
        const DIFF_MAX = 3.0;

        let shotTimer = null;
        let shotTimeLimit = 0;

        const TIMER_MAX_SEC = 30.0;
        const TIMER_MID_SEC = 10.0;
        const TIMER_MIN_SEC = 2.0;

        let barAnimId = null;
        let timerStartTime = 0;

        let stage = START_STAGE;
        document.getElementById("stage-val").innerText = stage;

        let hiStage = localStorage.getItem("stellarGravity_hiStage") || 1;
        document.getElementById("hi-stage-val").innerText = hiStage;

        const PLANETS = [
            { name: "W.Dwarf", radius: 10, color: "#aab7b8", score: 1 },
            { name: "Sirius.B", radius: 16, color: "#dfe6e9", score: 2 },
            { name: "B.Star", radius: 22, color: "#ff7675", score: 4 },
            { name: "Vega", radius: 30, color: "#74b9ff", score: 8 },
            { name: "Capella", radius: 38, color: "#a29bfe", score: 16 },
            { name: "Procyon", radius: 48, color: "#ffeaa7", score: 32 },
            { name: "Arcturus", radius: 58, color: "#fab1a0", score: 64 },
            { name: "Antares", radius: 70, color: "#ff9f43", score: 128 },
            { name: "BlackHole", radius: 85, color: "#ffffff", score: 256 }
        ];

        let engine, render, runner;

        let score = 0;
        let hiScore = localStorage.getItem("stellarGravity_hiScore") || 0;

        let isGameRunning = false;
        let isClickable = true;
        let nextQueue = [];
        let launcherAngle = -Math.PI / 2;

        let gameOverTime = null;
        let particles = [];
        let bgStars = [];
        let starCanvas = null;
        let staticStarAngle = 0;

        let implosionScale = 1.0;
        let implosionAlpha = 1.0;
        let isImploding = false;

        const CLEAR_INDEX = PLANETS.length - 1;
        let isBlackHoleCore = false;

        let lastMergeTime = 0;
        let comboCount = 0;

        function onClear() {
            clearCount++;
            difficulty = Math.min(DIFF_MAX, 1.0 + clearCount * DIFF_STEP);
        }

        /* Shot Timer */
        function startShotTimer() {
            const container = document.getElementById("timer-bar-container");
            const fill = document.getElementById("timer-bar-fill");

            if (!container || !fill) return;

            if (shotTimer) {
                clearTimeout(shotTimer);
                shotTimer = null;
            }
            if (barAnimId) {
                cancelAnimationFrame(barAnimId);
                barAnimId = null;
            }

            if (!isGameRunning || isPaused) {
                container.style.display = "none";
                return;
            }

            if (stage <= 6) {
                shotTimeLimit = TIMER_MAX_SEC - (stage - 1) * 4.0;
            } else {
                shotTimeLimit = Math.max(TIMER_MIN_SEC, TIMER_MID_SEC - (stage - 6) * 1.0);
            }

            const nextPlanetIndex = nextQueue.length > 1 ? nextQueue[1] : nextQueue[0];
            const nextPlanetColor = PLANETS[nextPlanetIndex].color;

            container.style.display = "block";
            fill.style.width = "100%";
            fill.style.opacity = "1";
            fill.style.background = nextPlanetColor;
            fill.style.boxShadow = `0 0 10px ${nextPlanetColor}`;

            timerStartTime = Date.now();

            shotTimer = setTimeout(() => {
                if (isGameRunning && isClickable && !isPaused) {
                    shoot();
                }
            }, shotTimeLimit * 1000);

            function updateBar() {
                if (!isGameRunning || isPaused) return;

                const elapsed = (Date.now() - timerStartTime) / 1000;
                const remainingRatio = Math.max(0, 1 - (elapsed / shotTimeLimit));
                const remainingSec = shotTimeLimit * remainingRatio;

                fill.style.width = (remainingRatio * 100) + "%";

                if (remainingRatio < 0.25 || remainingSec < 3.0) {
                    const blink = Math.sin(Date.now() * 0.02) * 0.5 + 0.5;
                    fill.style.background = "#ff0000";
                    fill.style.boxShadow = `0 0 15px #ff0000`;
                    fill.style.opacity = blink;
                } else {
                    fill.style.background = nextPlanetColor;
                    fill.style.boxShadow = `0 0 10px ${nextPlanetColor}`;
                    fill.style.opacity = "1";
                }

                if (remainingRatio > 0) {
                    barAnimId = requestAnimationFrame(updateBar);
                }
            }
            barAnimId = requestAnimationFrame(updateBar);
        }

        function requestFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            } else if (isIOS) {
                window.scrollTo(0, 0);
            }
        }

        function returnToTitle() {
            Runner.stop(runner);

            isGameRunning = false;
            isPaused = false;
            isClickable = false;
            isContinue = false;

            forceStopBGM();

            Composite.clear(engine.world, false);
            Runner.run(runner, engine);

            const overlay = document.getElementById("overlay");
            overlay.classList.remove("hide");

            document.querySelector("#overlay h1").innerHTML = "STELLAR<br>GRAVITY";
            document.getElementById("start-btn").textContent = "START";
            document.getElementById("clear-message").style.display = "none";

            const clearHiBtn = document.getElementById("clear-hi-btn");
            if (clearHiBtn) clearHiBtn.style.display = "";

            bgmToggleBtn.style.pointerEvents = "auto";
            bgmToggleBtn.style.opacity = "0.75";

            updateResetButtonVisibility();
        }

        /* Audio Setup */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let noiseBuffer = null;
        document.getElementById("hi-score-val").innerText = hiScore;
        const sfxMasterGain = audioCtx.createGain();
        sfxMasterGain.gain.value = 1.8;
        sfxMasterGain.connect(audioCtx.destination);

        function createNoiseBuffer() {
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        }

        /* SFX Functions */
        function playSuctionSound() {
            if (isPaused) return; // Pause中は音を鳴らさない
            const t = audioCtx.currentTime;
            const drum = audioCtx.createOscillator(), g = audioCtx.createGain();
            drum.type = 'sine';
            drum.frequency.setValueAtTime(140, t);
            drum.frequency.exponentialRampToValueAtTime(45, t + 1.5);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.6, t + 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
            drum.connect(g);
            g.connect(sfxMasterGain);
            drum.start(t);
            drum.stop(t + 1.8);

            if (!noiseBuffer) noiseBuffer = createNoiseBuffer();
            const burst = audioCtx.createBufferSource();
            burst.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(220, t);
            const nG = audioCtx.createGain();
            nG.gain.setValueAtTime(0.12, t);
            nG.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
            burst.connect(filter);
            filter.connect(nG);
            nG.connect(sfxMasterGain);
            burst.start(t);
            burst.stop(t + 1.2);
        }

        function playExplosionSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(60, t + 0.45);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.9, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer || (noiseBuffer = createNoiseBuffer());
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = "lowpass";
            noiseFilter.frequency.setValueAtTime(400, t);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
            const delay = audioCtx.createDelay(0.6);
            delay.delayTime.setValueAtTime(0.12, t);
            const feedback = audioCtx.createGain();
            feedback.gain.setValueAtTime(0.25, t);
            delay.connect(feedback);
            feedback.connect(delay);
            osc.connect(gain);
            gain.connect(sfxMasterGain);
            gain.connect(delay);
            delay.connect(sfxMasterGain);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(sfxMasterGain);
            osc.start(t);
            osc.stop(t + 0.8);
            noise.start(t);
            noise.stop(t + 0.5);
        }

        /* ---------------------------------------------------------
         * SFX: Black Hole (Original Version)
         * - LFO modulated Triangle + Sine boom
         * --------------------------------------------------------- */
        function playBlackHoleSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const t = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            osc1.type = "triangle";
            osc1.frequency.setValueAtTime(42, t + 0.3);
            osc1.frequency.exponentialRampToValueAtTime(18, t + 2.2);

            const gain1 = audioCtx.createGain();
            gain1.gain.setValueAtTime(0.0001, t);
            gain1.gain.exponentialRampToValueAtTime(0.45, t + 0.6);
            gain1.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

            const lfo = audioCtx.createOscillator();
            lfo.type = "sine";
            lfo.frequency.setValueAtTime(6, t);

            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(14, t);

            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);

            const boom = audioCtx.createOscillator();
            boom.type = "sine";
            boom.frequency.setValueAtTime(60, t + 2.3);
            boom.frequency.exponentialRampToValueAtTime(28, t + 2.55);

            const boomGain = audioCtx.createGain();
            boomGain.gain.setValueAtTime(0.0001, t + 2.25);
            boomGain.gain.exponentialRampToValueAtTime(1.0, t + 2.35);
            boomGain.gain.exponentialRampToValueAtTime(0.0001, t + 2.9);

            osc1.connect(gain1);
            gain1.connect(sfxMasterGain);

            boom.connect(boomGain);
            boomGain.connect(sfxMasterGain);

            osc1.start(t + 0.3);
            osc1.stop(t + 2.5);

            lfo.start(t);
            lfo.stop(t + 2.5);

            boom.start(t + 2.25);
            boom.stop(t + 3.0);
        }

        /* Drawing Logic */
        function drawPlanet(ctx, x, y, r, color, time, bodyId) {
            ctx.save();
            ctx.translate(x, y);
            // 念のためシャドウをリセット
            ctx.shadowBlur = 0;

            // パルス（鼓動）の計算
            const pulse = Math.sin(time * 0.003 + bodyId) * 0.05 + 0.95;
            const curR = r * pulse;

            // 1. 外側のパルス波紋（既存の処理）
            for (let i = 0; i < 3; i++) {
                const shift = Math.sin(time * 0.002 + (i * 2) + bodyId) * (r * 0.15);
                ctx.beginPath();
                // 少しずつ大きさと透明度を変えて重ねる
                ctx.arc(0, 0, curR + shift + (i * 2) + 2, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.25 - (i * 0.08); // 少し薄めに調整
                ctx.fill();
            }

            // 2. 【追加】光沢（グロー）の代わりとなる、大きくて薄い円
            // shadowBlur の代わりに、本体の1.4倍の大きさで薄く描画します
            ctx.beginPath();
            ctx.arc(0, 0, curR * 1.1, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.25; // 薄く発光させる
            ctx.fill();

            // 3. 惑星本体の描画
            ctx.globalAlpha = 1.0; // 不透明に戻す
            ctx.beginPath();
            ctx.arc(0, 0, curR, 0, Math.PI * 2);
            ctx.fillStyle = color;

            // ▼▼▼ 以前のシャドウ設定を削除 ▼▼▼
            // ctx.shadowColor = color;
            // ctx.shadowBlur = curR * 1.5;
            // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

            ctx.fill();
            ctx.restore();
        }

        const STAR_COUNT = Math.floor(120 * 4);
        const STAR_SIZE_MIN = 0.2;
        const STAR_SIZE_MAX = 2.0;

        function generateStars() {
            bgStars = [];
            const maxDimension = Math.max(WIDTH, HEIGHT) * 1.5;

            for (let i = 0; i < STAR_COUNT; i++) {
                const rand = Math.random();
                let baseColor;
                // 色の決定（rgbのみ）
                if (rand < 0.6) baseColor = "255, 255, 255";
                else if (rand < 0.8) baseColor = "180, 220, 255";
                else if (rand < 0.95) baseColor = "255, 255, 200";
                else baseColor = "255, 180, 180";

                bgStars.push({
                    r: Math.random() * maxDimension,       // 中心からの距離
                    angle: Math.random() * Math.PI * 2,    // 角度
                    size: STAR_SIZE_MIN + Math.random() * (STAR_SIZE_MAX - STAR_SIZE_MIN),
                    colorBase: baseColor,                  // RGB値
                    baseAlpha: 0.2 + Math.random() * 0.6,  // 基本の透明度
                    blinkSpeed: 0.002 + Math.random() * 0.005, // 点滅の速さ
                    blinkPhase: Math.random() * Math.PI * 2    // 点滅のタイミングのズレ
                });
            }
            // starCanvas (画像キャッシュ) は使用しないため削除
            starCanvas = null;
        }


        /* =========================================================
         * Refactored Initialization & Loops
         * ========================================================= */

        // ---------------------------------------------------------
        // 1. Helper Functions (Moved out from preInit)
        // ---------------------------------------------------------

        function removeAllDynamicBodies() {
            const bodies = Composite.allBodies(engine.world).filter(b => !b.isStatic);
            if (bodies.length) Composite.remove(engine.world, bodies);
        }

        function triggerSupernovaAt(x, y, color = "#ffffff") {
            isImploding = true;
            implosionScale = 1.0;
            implosionAlpha = 1.0;
            let startTime = performance.now();

            const animateImplosion = (now) => {
                const elapsed = now - startTime;
                if (elapsed < 300) {
                    implosionScale = 1.0 + (elapsed / 300) * 0.5;
                } else if (elapsed < 900) {
                    const p = (elapsed - 300) / 600;
                    implosionScale = 1.5 * (1 - p);
                    implosionAlpha = 1 - p;
                } else {
                    isImploding = false;
                    implosionScale = 0;
                    return;
                }
                requestAnimationFrame(animateImplosion);
            };
            requestAnimationFrame(animateImplosion);

            // Flash & Waves
            particles.push({ type: "flash", life: 1.0, color: "rgba(255,255,255,1)" });
            setTimeout(() => { particles.push({ type: "flash", life: 0.6, color: "rgba(255,200,150,0.8)" }); }, 120);
            setTimeout(() => { particles.push({ type: "flash", life: 0.35, color: "rgba(255,120,80,0.6)" }); }, 300);

            const waves = [{ r: 10, sp: 10, life: 1.2 }, { r: 40, sp: 8, life: 1.1 }, { r: 90, sp: 6, life: 1.0 }, { r: 160, sp: 4, life: 0.9 }, { r: 240, sp: 2.5, life: 0.8 }];
            waves.forEach((w, i) => {
                setTimeout(() => {
                    particles.push({ type: "shockwave", x, y, radius: w.r, speed: w.sp, life: w.life });
                }, i * 80);
            });

            // Particles (Reduced count)
            for (let i = 0; i < 160; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = Math.random() * 14 + 4;
                particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1.2, color, size: Math.random() * 3.2 + 1.2 });
            }

            // Black Hole implosion effect
            setTimeout(() => {
                particles.push({ type: "flash", life: 0.9, color: "rgba(0,0,0,0.85)" });
                particles.push({ type: "shockwave", x, y, radius: Math.max(WIDTH, HEIGHT), speed: -10, life: 1.4 });
                for (let i = 0; i < 120; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const r = Math.random() * 260 + 60;
                    const sp = Math.random() * 6 + 3;
                    particles.push({ x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r, vx: -Math.cos(ang + Math.PI / 6) * sp, vy: -Math.sin(ang + Math.PI / 6) * sp, life: 1.3, color: "#ffffff", size: Math.random() * 2.2 + 0.8 });
                }
                if (typeof playBlackHoleSound === "function") playBlackHoleSound();
            }, 520);

            playExplosionSound();
            setTimeout(playExplosionSound, 180);
            setTimeout(playExplosionSound, 420);
        }

        // ---------------------------------------------------------
        // 2. Physics & Engine Setup
        // ---------------------------------------------------------
        function initPhysics() {
            generateStars();

            engine = Engine.create({
                gravity: { x: 0, y: 0, scale: 0 },
                enableSleeping: false
            });

            render = Render.create({
                element: document.getElementById("canvas-container"),
                engine: engine,
                options: {
                    width: WIDTH,
                    height: HEIGHT,
                    wireframes: false,
                    background: "transparent"
                }
            });

            Render.run(render);
            runner = Runner.create({
                isFixed: true,
                delta: 1000 / 60
            });
            Runner.run(runner, engine);
        }

        // ---------------------------------------------------------
        // 3. Game Logic Events (Gravity & Collision)
        // ---------------------------------------------------------
        function setupGameLogic() {
            // [Gravity] - Pull objects to center
            Events.on(engine, "beforeUpdate", () => {
                Composite.allBodies(engine.world).forEach(b => {
                    if (b.isStatic) return;
                    // Remove if out of bounds
                    if (Math.abs(b.position.x - CENTER.x) > WIDTH || Math.abs(b.position.y - CENTER.y) > HEIGHT) {
                        Composite.remove(engine.world, b);
                        return;
                    }
                    const dx = CENTER.x - b.position.x;
                    const dy = CENTER.y - b.position.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const force = 0.0028 * b.mass;
                    Body.applyForce(b, b.position, { x: (dx / dist) * force, y: (dy / dist) * force });
                });
            });

            // [Collision] - Merge planets
            Events.on(engine, "collisionStart", (e) => {
                if (!isGameRunning || isClearing) return;
                e.pairs.forEach(p => {
                    const a = p.bodyA;
                    const b = p.bodyB;
                    if (a.index === undefined || b.index === undefined || a.isMerging || b.isMerging) return;
                    if (a.index !== b.index || a.index >= PLANETS.length - 1) return;

                    // Execute Merge
                    a.isMerging = true;
                    b.isMerging = true;
                    const mid = { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };

                    // ★修正箇所: 変数の定義(nI, nP)を先に持ってくる
                    const nI = a.index + 1;
                    const nP = PLANETS[nI];

                    Composite.remove(engine.world, [a, b]);
                    playExplosionSound();

                    // Push neighbors
                    const allBodies = Composite.allBodies(engine.world);
                    allBodies.forEach(body => {
                        if (body.isStatic || body.isMerging) return;
                        const dx = body.position.x - mid.x;
                        const dy = body.position.y - mid.y;
                        const distSq = dx * dx + dy * dy;
                        const forceRadius = 150;
                        if (distSq < forceRadius * forceRadius) {
                            const dist = Math.sqrt(distSq);
                            const forceMagnitude = 0.003 * body.mass;
                            Body.applyForce(body, body.position, { x: (dx / dist) * forceMagnitude, y: (dy / dist) * forceMagnitude });
                        }
                    });

                    // Effects
                    particles.push({ type: "shockwave", x: mid.x, y: mid.y, radius: 10, speed: 5, life: 1 });
                    for (let i = 0; i < 12; i++) {
                        const ang = Math.random() * Math.PI * 2;
                        const s = Math.random() * 4 + 2;
                        particles.push({ x: mid.x, y: mid.y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: 1, color: nP.color, size: 3 });
                    }

                    // Score & Combo
                    const now = Date.now();
                    if (now - lastMergeTime < 800) comboCount++;
                    else comboCount = 0;
                    lastMergeTime = now;

                    const comboBonus = 1 + (comboCount * 0.2);
                    const points = nI === CLEAR_INDEX ? SUPERNOVA_BONUS : nP.score;
                    updateScore(Math.floor(points * comboBonus));
                    showComboText(mid.x, mid.y, comboCount);

                    // Create Next Body or Clear
                    setTimeout(() => {
                        if (nI === CLEAR_INDEX) {
                            if (isClearing) return;
                            isClearing = true;
                            isBlackHoleCore = true;
                            isGameRunning = false;
                            isClickable = false;
                            triggerSupernovaAt(mid.x, mid.y, "#ffffff");
                            setTimeout(removeAllDynamicBodies, SUPERNOVA_CLEAR_DELAY);
                            setTimeout(triggerGameClear, SUPERNOVA_END_DELAY);
                        } else {
                            const nb = Bodies.circle(mid.x, mid.y, nP.radius, {
                                index: nI,
                                restitution: 0.4,
                                friction: 0.8,
                                frictionAir: 0.02,
                                render: { visible: false }
                            });
                            Composite.add(engine.world, nb);
                        }
                    }, 40);
                });
            });
        }

        // ---------------------------------------------------------
        // 4. Drawing / Render Loop functions
        // ---------------------------------------------------------
        function drawBackground(ctx) {
            // --- 共通変数の準備 ---
            const mult = isBoosting ? STAR_BOOST_MULT : 1.0;
            if (!isPaused) staticStarAngle -= 0.0025 * mult;

            const now = Date.now();
        

            // =========================================================
            // 1. 星の描画
            // =========================================================
            ctx.save();
            ctx.translate(CENTER.x, CENTER.y);
            ctx.rotate(staticStarAngle);

            for (let i = 0; i < bgStars.length; i++) {
                const s = bgStars[i];
                const blink = Math.sin(now * s.blinkSpeed + s.blinkPhase);
                const currentAlpha = Math.max(0.1, Math.min(1, s.baseAlpha + blink * 0.3));

                ctx.fillStyle = `rgba(${s.colorBase}, ${currentAlpha})`;
                if (s.size > 1.8) {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = `rgba(${s.colorBase}, ${currentAlpha})`;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.beginPath();
                const x = Math.cos(s.angle) * s.r;
                const y = Math.sin(s.angle) * s.r;
                ctx.arc(x, y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

    
        }


        function drawRedZone(ctx, t, isWarning) {
            ctx.save();
            ctx.translate(CENTER.x, CENTER.y);
            ctx.beginPath();
            ctx.arc(0, 0, DEADLINE_RADIUS, 0, Math.PI * 2);
            ctx.setLineDash([10, 14]);
            ctx.lineDashOffset = -(t * 0.02) % 1000;

            const blinkBase = isWarning ? 0.7 : 0.3;
            const blinkFreq = isWarning ? 0.015 : 0.006;
            const blink = blinkBase + (1 - blinkBase) * (0.5 + 0.5 * Math.sin(t * blinkFreq));

            ctx.strokeStyle = isWarning ? `rgba(255, 0, 0, ${blink})` : `rgba(255, 60, 60, ${blink})`;
            ctx.lineWidth = isWarning ? 4 : 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.arc(0, 0, DEADLINE_RADIUS + 3, 0, Math.PI * 2);
            ctx.strokeStyle = isWarning ? `rgba(255, 0, 0, ${blink * 0.5})` : "rgba(255, 80, 80, 0.25)";
            ctx.lineWidth = isWarning ? 10 : 6;
            ctx.stroke();
            ctx.restore();
        }

        function spawnSparks(isWarning) {
            if (isPaused) return;
            const SPARK_RATE = isWarning ? 0.8 : (isIOS ? 0.25 : 0.45);
            const SPARK_MAX = 220;
            if (particles.length > SPARK_MAX) particles.splice(0, particles.length - SPARK_MAX);

            if (Math.random() < SPARK_RATE) {
                const burst = 2 + (isBoosting ? 4 : 2);
                for (let k = 0; k < burst; k++) {
                    const ang = Math.random() * Math.PI * 2;
                    const r = DEADLINE_RADIUS + (Math.random() * 10 - 5);
                    const x = CENTER.x + Math.cos(ang) * r;
                    const y = CENTER.y + Math.sin(ang) * r;
                    const sp = (isBoosting ? 5.0 : 3.2) * (0.6 + Math.random() * 0.8);
                    const ox = Math.cos(ang) * sp + (Math.random() - 0.5);
                    const oy = Math.sin(ang) * sp + (Math.random() - 0.5);
                    particles.push({
                        type: "spark",
                        x, y, px: x, py: y, vx: ox, vy: oy,
                        life: 1.0,
                        size: 1.5 + Math.random() * 2.5,
                        color: isWarning ? "rgba(255, 255, 255, 1)" : "rgba(255,60,60,1)"
                    });
                }
            }
        }

        function drawCore(ctx, now) {
            ctx.save();
            ctx.translate(CENTER.x, CENTER.y);
            const currentRadius = CORE_RADIUS * implosionScale;

            if (isImploding) {
                ctx.globalAlpha = implosionAlpha;
                const gR = currentRadius * 3;
                const grad = ctx.createRadialGradient(0, 0, currentRadius, 0, 0, gR);
                grad.addColorStop(0, "rgba(255, 120, 50, 0.9)");
                grad.addColorStop(1, "rgba(255, 0, 0, 0)");
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, gR, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#fff700"; ctx.fill();
                ctx.globalAlpha = 1.0;
            } else if (isBlackHoleCore) {
                const t2 = performance.now() * 0.002;
                for (let i = 0; i < 6; i++) {
                    const r = CORE_RADIUS * (1.8 + i * 0.25);
                    const a = 0.15 + Math.sin(t2 + i) * 0.1;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255,80,40,${a})`;
                    ctx.lineWidth = 6; ctx.stroke();
                }
                const holeGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, CORE_RADIUS);
                holeGrad.addColorStop(0, "rgba(0,0,0,1)");
                holeGrad.addColorStop(0.6, "rgba(30,0,0,0.9)");
                holeGrad.addColorStop(1, "rgba(0,0,0,1)");
                ctx.fillStyle = holeGrad;
                ctx.beginPath(); ctx.arc(0, 0, CORE_RADIUS, 0, Math.PI * 2); ctx.fill();
            } else {
                const gR = CORE_RADIUS * 3 + Math.sin(now * 0.008) * 5;
                const grad = ctx.createRadialGradient(0, 0, CORE_RADIUS, 0, 0, gR);
                grad.addColorStop(0, "rgba(255, 120, 50, 0.9)");
                grad.addColorStop(1, "rgba(255, 0, 0, 0)");
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, gR, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, CORE_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = "#fff700"; ctx.fill();
            }
            ctx.restore();
        }

        // NEXT表示用のコンテキスト
        let nextCtx = null;

        function initNextCanvas() {
            const container = document.getElementById("next-ui");
            if (!container) return;

            // 既存の中身をクリア
            container.innerHTML = "";

            const c = document.createElement("canvas");
            const dpr = window.devicePixelRatio || 1;

            // 解像度を高くしてクッキリさせる
            c.width = 46 * dpr; // サイズ変更
            c.height = 46 * dpr;

            // 表示サイズ
            c.style.width = "46px";
            c.style.height = "46px";

            nextCtx = c.getContext("2d");
            nextCtx.scale(dpr, dpr);

            container.appendChild(c);
        }

        function drawLauncher(ctx, now) {
            // 1. 発射台の描画（光線に変更）
            if (isGameRunning && isClickable) {
                const sX = CENTER.x + Math.cos(launcherAngle) * SPAWN_RADIUS;
                const sY = CENTER.y + Math.sin(launcherAngle) * SPAWN_RADIUS;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([4, 6]);
                ctx.strokeStyle = "rgba(180, 180, 180, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.moveTo(sX, sY);
                ctx.lineTo(CENTER.x, CENTER.y);
                ctx.stroke();
                ctx.restore();

                // 次の発射弾
                drawPlanet(ctx, sX, sY, PLANETS[nextQueue[0]].radius, PLANETS[nextQueue[0]].color, now, 0);
            }

            // 2. NEXT表示の更新
            if (nextCtx && nextQueue.length >= 2) {
                // NEXT Canvasのサイズを CSS に合わせて 46x46 に変更
                nextCtx.clearRect(0, 0, 46, 46);
                const nextPlanet = PLANETS[nextQueue[1]];
                const uiScale = 0.65;  // 枠に収まるように微調整
                // 中心座標を (23, 23) に変更
                drawPlanet(nextCtx, 23, 23, nextPlanet.radius * uiScale, nextPlanet.color, now, 1);
            }
        }

        function manageParticles(ctx) {
            const MAX_PARTICLES = isIOS ? 150 : 300;
            if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (!isPaused) {
                    if (p.type === "flash") p.life -= 0.07;
                    else if (p.type === "spark") p.life -= 0.04;
                    else p.life -= 0.02;
                }
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                if (!isPaused) {
                    p.px = p.x; p.py = p.y;
                    p.x += (p.vx || 0);
                    p.y += (p.vy || 0);
                    if (p.type === "shockwave") p.radius += (p.speed || 0) * 0.5;
                }

                // Drawing particles based on type
                if (p.type === "shockwave") {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255,255,255,${p.life})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                } else if (p.type === "flash") {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color || "rgba(255,255,255,1)";
                    ctx.fillRect(0, 0, WIDTH, HEIGHT);
                    ctx.restore();
                } else if (p.type === "spark") {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    ctx.globalAlpha = p.life;
                    ctx.strokeStyle = p.color || "rgba(255,60,60,1)";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(p.px, p.py);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                    ctx.fillStyle = "rgba(255,120,120,1)";
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                } else if (p.type === "combo-dust") {
                    ctx.save();
                    ctx.shadowBlur = 10; ctx.shadowColor = "#ffffff";
                    ctx.globalAlpha = p.life; ctx.fillStyle = "#ffffff";
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; ctx.globalAlpha = p.life * 0.8;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }
        }

        function checkGameOverCondition(now) {
            if (isGameRunning && !isPaused) {
                let isOut = false;
                Composite.allBodies(engine.world).forEach(b => {
                    if (!b.isStatic && b.index !== undefined) {
                        const d = Math.sqrt((b.position.x - CENTER.x) ** 2 + (b.position.y - CENTER.y) ** 2);
                        if (d > DEADLINE_RADIUS) isOut = true;
                    }
                });
                if (isOut) {
                    if (!gameOverTime) gameOverTime = now;
                    if (now - gameOverTime > 3000) triggerGameOver();
                } else {
                    gameOverTime = null;
                }
            }
        }

        function setupRenderLoop() {
            Events.on(render, "afterRender", () => {
                const ctx = render.context;
                const now = Date.now();
                const t = performance.now();

                // Update Game Logic (Rotation)
                if (isGameRunning && !isPaused) {
                    const base = ROTATE_BASE_SPEED * difficulty;
                    const speed = isBoosting ? base * ROTATE_BOOST_MULT : base;
                    launcherAngle += speed;
                }

                // Update UI Text
                if (nextQueue.length >= 2) {
                    const nextPlanet = PLANETS[nextQueue[1]];
                    const nextNameEl = document.getElementById("next-name");
                    if (nextNameEl) {
                        nextNameEl.textContent = nextPlanet.name;
                        nextNameEl.style.color = nextPlanet.color;
                    }
                }

                // --- Draw Sequence ---
                drawBackground(ctx);

                ctx.globalAlpha = 1;

                const isWarning = gameOverTime !== null;
                drawRedZone(ctx, t, isWarning);
                spawnSparks(isWarning);

                drawCore(ctx, now);

                // Draw Existing Planets
                Composite.allBodies(engine.world).forEach(b => {
                    if (!b.isStatic && b.index !== undefined) {
                        drawPlanet(ctx, b.position.x, b.position.y, b.circleRadius, PLANETS[b.index].color, now, b.id);
                    }
                });

                drawLauncher(ctx, now);
                manageParticles(ctx);
                checkGameOverCondition(now);
            });
        }

        // 5. Main Init Function (Simplified)
        // ---------------------------------------------------------
        function preInit() {
            initPhysics();
            initNextCanvas();
            setupGameLogic();
            setupRenderLoop();
        }

        /* Controls */

        const clearHiBtn = document.getElementById("clear-hi-btn");

        boostBtn.addEventListener("mouseup", (e) => { e.stopPropagation(); isBoosting = false; });
        boostBtn.addEventListener("mouseleave", () => { isBoosting = false; });
        boostBtn.addEventListener("touchstart", (e) => { e.preventDefault(); e.stopPropagation(); isBoosting = true; }, { passive: false });
        boostBtn.addEventListener("touchend", (e) => { e.preventDefault(); e.stopPropagation(); isBoosting = false; }, { passive: false });
        boostBtn.addEventListener("touchcancel", () => { isBoosting = false; });

        window.addEventListener("keydown", (e) => {
            if (isPaused) return;
            if (e.code === "Space") { e.preventDefault(); isBoosting = true; }
            if (e.code === "Enter" || e.code === "ArrowUp") {
                e.preventDefault();
                if (isGameRunning && document.getElementById("overlay").classList.contains("hide")) {
                    shoot(e);
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") isBoosting = false;
        });

        setInterval(() => {
            boostBtn.style.boxShadow = isBoosting ? "0 0 20px rgba(79,172,254,0.9)" : "none";
        }, 50);

        function updateScore(points) {
            score += points;
            const scoreEl = document.getElementById("score-val"); // 要素を取得
            scoreEl.innerText = score;

            // ▼▼▼ 追加: アニメーションクラスの付け外し ▼▼▼
            scoreEl.classList.remove("score-bounce"); // 一旦外す（連打対応）
            void scoreEl.offsetWidth; // リフローを強制してアニメーションをリセット

                hiScore = score;
                document.getElementById("hi-score-val").innerText = hiScore;
                localStorage.setItem("stellarGravity_hiScore", hiScore);
            }
        }

        function showComboText(x, y, count) {
            if (count < 1) return;
            const comboEl = document.createElement("div");
            comboEl.innerHTML = `<div style="font-size: 18px; letter-spacing: 5px; font-weight: 200;">COMBO +${count + 1}</div>`;
            comboEl.style.position = "fixed";
            comboEl.style.left = `${x}px`;
            comboEl.style.top = `${y - 40}px`;
            comboEl.style.textAlign = "center";
            comboEl.style.color = "#ffffff";
            comboEl.style.fontFamily = "'Orbitron', sans-serif";
            comboEl.style.fontWeight = "bold";
            comboEl.style.textShadow = "0 0 12px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.3)";
            comboEl.style.pointerEvents = "none";
            comboEl.style.zIndex = "2000";
            comboEl.style.transform = "translateX(-50%)";
            comboEl.style.transition = "transform 2.0s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.0s ease-out";
            document.body.appendChild(comboEl);
            if (Array.isArray(particles)) {
                for (let i = 0; i < 25; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const sp = Math.random() * 4 + 2;
                    particles.push({ x, y: y - 40, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1.0, color: "#ffffff", size: Math.random() * 2 + 1, type: "combo-dust" });
                }
            }
            setTimeout(() => {
                comboEl.style.transform = "translate(-50%, -100px)";
                comboEl.style.opacity = "0";
            }, 20);
            setTimeout(() => comboEl.remove(), 2100);
        }

        function triggerGameClear() {

            const vxT = -Math.sin(launcherAngle);

            const vx = (vxC + vxT * BOOST_DRIFT) * BASE_SPEED;
            const vy = (vyC + vyT * BOOST_DRIFT) * BASE_SPEED;

        let resizeTimeout;

                const oldCenter = { ...CENTER };

        let bgmFadeInterval = null;

        function fadeOut(audio, callback) {
            if (!audio) { if (callback) callback(); return; }
            if (bgmFadeInterval) { clearInterval(bgmFadeInterval); bgmFadeInterval = null; }
            isBgmFading = true;
            let vol = audio.volume;
            bgmFadeInterval = setInterval(() => {
                vol -= 0.05;
                if (vol > 0.05) {
                    audio.volume = vol;
                } else {
                    clearInterval(bgmFadeInterval);
                    bgmFadeInterval = null;
                    audio.pause();
                    audio.volume = 0;
                    audio.currentTime = 0;
                    isBgmFading = false;
                    if (callback) callback();
                }
            }, 30);
        }

        function stopBGM(callback = null) {
            if (!currentAudio) { if (callback) callback(); return; }
            fadeOut(currentAudio, () => {
                currentAudio = null;
                if (callback) callback();
            });

            if (bgmFadeInterval) { clearInterval(bgmFadeInterval); bgmFadeInterval = null; }

                    audio.play().then(() => {

                        audio.currentTime = 0;
                    }).catch(e => { });
                }
            });
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('mousedown', unlockAudio);
        }
        window.addEventListener('touchstart', unlockAudio, { once: false });
        window.addEventListener('mousedown', unlockAudio, { once: false });

        function playClearBgm() {
            if (!isBgmEnabled) {
                forceStopBGM(); // 音を止める処理だけは行う
                return;
            }
            forceStopBGM();

            if (audioCtx.state === "suspended") { audioCtx.resume(); }
            clearBgm.currentTime = 0;
            clearBgm.volume = 0.3;
            const playPromise = clearBgm.play();
            if (playPromise !== undefined) {
                playPromise.then(() => { currentAudio = clearBgm; }).catch(err => {
                    const retryPlay = () => { clearBgm.play(); currentAudio = clearBgm; window.removeEventListener('touchstart', retryPlay); };
                    window.addEventListener('touchstart', retryPlay);
                });
            }
        }

        function playTitleBGM() {
            // isPaused のチェックが入っているため、画面がフォーカスを失った時に再生されないようになります
            if (!isBgmEnabled || isPaused || isGameRunning) {

            activeTrackItem = listItem;

            audioEl.play().catch(e => console.log(e));
            currentAudio = audioEl;
        }

            const rawName = nameInput.value.trim();

            // バリデーション: 空文字またはスペースのみを防止
            if (!rawName) {
                alert("名前を入力してください。");
                return;
            }

            const name = rawName;
            submitBtn.disabled = true;
            submitBtn.textContent = "SENDING...";

            try {
                await addDoc(collection(db, SCORES_COLLECTION), {
                    name: name,
                    score: Number(score), // 数値型を保証
                    stage: Number(stage),
                    timestamp: serverTimestamp()
                });

                // 送信成功後の処理
                nameInputArea.style.display = "none";
                localStorage.setItem("stellarGravity_last_name", name);

                // ★重要: ここでボタン類を再表示させる
                if (typeof updateResetButtonVisibility === "function") {
                    updateResetButtonVisibility();
                }

                // タイトル画面の表記に戻す
                document.querySelector("#overlay h1").innerHTML = "STELLAR<br>GRAVITY";
                document.getElementById("start-btn").textContent = "START";

                // ランキングを再取得して表示
                await fetchAndShowRanking();

            } catch (e) {
                console.error("Error adding document: ", e);
                alert("通信エラーが発生しました。");
                submitBtn.disabled = false;
                submitBtn.textContent = "SUBMIT SCORE";
            }
        };

        // --- Event Listeners ---
        showRankingBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            fetchAndShowRanking();
        });

        closeRankingBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            rankingOverlay.style.display = "none";

            document.querySelector("#overlay h1").innerHTML = "STELLAR<br>GRAVITY";
            document.getElementById("start-btn").textContent = "START";
        });

        // SKIPボタン
        skipBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            document.getElementById("name-input-area").style.display = "none";

            // タイトル画面の表記に戻す
            document.querySelector("#overlay h1").innerHTML = "STELLAR<br>GRAVITY";
            document.getElementById("start-btn").textContent = "START";

            // ボタンを再表示させるために呼び出し
            updateResetButtonVisibility();
        });

        // 送信ボタン (引数にstageを追加)
        submitBtn.addEventListener("click", () => {
            const finalScore = window.finalScore || 0;
            const finalStage = window.finalStage || 1; // ステージ情報を取得
            window.submitMyScore(finalScore, finalStage);
        });

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, function (match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
            });
        }

        const lastName = localStorage.getItem("stellarGravity_last_name");
        if (lastName) nameInput.value = lastName;

    </script>
</body>
</html>
